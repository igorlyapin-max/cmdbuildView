{% extends "base.html" %}

{% block title %}Вход в CMDBuild{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="auth-panel">
    <div class="panel-header">
      <p class="eyebrow">CMDBuild REST v3</p>
      <h1>Вход</h1>
    </div>

    {% if error %}
      <div class="alert" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" class="form">
      <label>
        <span>CMDBuild API URL</span>
        <input name="cmdbuild_url" type="url" value="{{ cmdbuild_url }}" required>
      </label>

      <label>
        <span>Пользователь</span>
        <input name="username" type="text" autocomplete="username" required>
      </label>

      <label>
        <span>Пароль</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>

      <button type="submit">Войти и загрузить классы</button>
    </form>
  </div>
</section>
{% endblock %}
